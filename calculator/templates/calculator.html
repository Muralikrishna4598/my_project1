<!DOCTYPE html>
<html>
<head>
    <title>Simple Calculator</title>
</head>
<body>
    <h2>Simple Calculator</h2>
    <form method="post">
        {% csrf_token %}
        <input type="number" name="num1" step="any" placeholder="Enter number 1" required>
        <input type="number" name="num2" step="any" placeholder="Enter number 2" required>
        <br><br>
        <select name="operation">
            <option value="add">Add ➕</option>
            <option value="subtract">Subtract ➖</option>
            <option value="multiply">Multiply ✖️</option>
            <option value="divide">Divide ➗</option>
        </select>
        <br><br>
        <button type="submit">Calculate</button>
    </form>
    {% if result != '' %}
        <h3>Result: {{ result }}</h3>
    {% endif %}
</body>
</html>
