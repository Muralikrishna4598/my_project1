<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Calculator</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #f2f4f8;
        }
        .calculator-container {
            max-width: 500px;
            margin: 60px auto;
            background: #fff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.1);
        }
        .form-control, .btn, .form-select {
            border-radius: 8px;
        }
    </style>
</head>
<body>
    <div class="calculator-container">
        <h2 class="text-center mb-4">🧮 Simple Calculator</h2>
        <form method="post">
            {% csrf_token %}
            <div class="mb-3">
                <label for="num1" class="form-label">Number 1</label>
                <input type="number" step="any" class="form-control" id="num1" name="num1" placeholder="Enter number 1" required>
            </div>
            <div class="mb-3">
                <label for="num2" class="form-label">Number 2</label>
                <input type="number" step="any" class="form-control" id="num2" name="num2" placeholder="Enter number 2" required>
            </div>
            <div class="mb-3">
                <label for="operation" class="form-label">Select Operation</label>
                <select class="form-select" id="operation" name="operation" required>
                    <option value="add">Add ➕</option>
                    <option value="subtract">Subtract ➖</option>
                    <option value="multiply">Multiply ✖️</option>
                    <option value="divide">Divide ➗</option>
                </select>
            </div>
            <div class="d-grid">
                <button type="submit" class="btn btn-primary">Calculate</button>
            </div>
        </form>
        {% if result != '' %}
            <div class="alert alert-info mt-4 text-center">
                <h4>Result: {{ result }}</h4>
            </div>
        {% endif %}
    </div>
</body>
</html>
